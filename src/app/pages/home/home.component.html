<div class="home">
  <div class="home-header">
    <div class="region-tabs">
      <button
        *ngFor="let r of regions"
        [class.active]="r.code === selectedRegion"
        (click)="setRegion(r.code)"
        class="region-btn"
      >{{ r.label }}</button>
    </div>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Cargando videos...</p>
  </div>

  <div *ngIf="error" class="error-state">
    <p>{{ error }}</p>
    <button (click)="load()" class="retry-btn">Reintentar</button>
  </div>

  <div class="video-grid">
    <app-video-card
      *ngFor="let v of videos; let i = index"
      [video]="v"
      [style.animation-delay]="(i * 0.04) + 's'"
    ></app-video-card>
  </div>
</div>
